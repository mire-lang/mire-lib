name: CI

on:
  push:
    branches: [beta-stdlib, main, master]
  pull_request:
    branches: [beta-stdlib, main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget ca-certificates pkg-config build-essential \
            libsodium-dev zlib1g-dev libzstd-dev libarchive-dev \
            zsh protobuf-compiler tcc libtcc-dev gcc

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install LLVM 22 (required by the Mire compiler / Avenys)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq \
            llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Checkout Avenys (the Mire compiler) as a dependency
        uses: actions/checkout@v4
        with:
          repository: mire-lang/Avenys-rust
          path: avenys-src
          ref: main

      - name: Build the Mire compiler (Avenys) in release mode
        working-directory: avenys-src
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo build --release

      - name: Install Mire stdlib into the Owl library directory
        run: |
          mkdir -p "$HOME/.owl/libs/mire"
          cp -a src/* "$HOME/.owl/libs/mire/"
          cp owl.toml "$HOME/.owl/libs/mire/"

      - name: Smoke-check that the compiler can load mire::std and mire::vec
        run: |
          # Env values in `env:` are not shell-expanded by GitHub, so resolve
          # the paths inside the script where $GITHUB_WORKSPACE and $HOME are
          # real shell variables.
          MIRE_BIN="$GITHUB_WORKSPACE/avenys-src/target/release/mire"
          MIRE_LIB_DIR="$HOME/.owl/libs"
          export MIRE_BIN MIRE_LIB_DIR
          mkdir -p /tmp/mire-smoke
          cat > /tmp/mire-smoke/main.mire <<'MIRE'
          load mire::std
          load mire::vec
          pub fn main: () :i32 {
              set v = vec::with::capacity::i64(4) mut
              set v = vec::push::i64(v 7)
              out::println("smoke ok")
              return 0 :i32
          }
          MIRE
          "$MIRE_BIN" build /tmp/mire-smoke/main.mire --debug -O0 \
            --lib-dir "$MIRE_LIB_DIR" --no-analysis-cache
          /tmp/mire-smoke/bin/debug/main

      - name: Run mire::std integration tests
        run: |
          MIRE_BIN="$GITHUB_WORKSPACE/avenys-src/target/release/mire"
          MIRE_LIB_DIR="$HOME/.owl/libs"
          export MIRE_BIN MIRE_LIB_DIR
          MIRE="$MIRE_BIN" bash tests/std_io.sh
