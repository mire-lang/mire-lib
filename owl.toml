[project]
name = "mire"
version = "2.0.0-beta"
description = "Library for the Mire language - stdlib reorganization (beta)"
entry = "src/lib.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0
artifact = "shared"
runtime = "minimal"
target = "x86_64-unknown-linux-gnu"
panic = "abort"
incremental = true
debug-info = true

[paths]
sources = "src"
tests = "tests"
output = "bin"
cache = "bin/.cache"
source = "src"
test = "tests"
bin = "bin"
generated = "bin/generated"

[cfg]
publisher = "publish.toml"
registry = "mor"

[dependencies]

[exports]
# alloc/ - memory management, data structures
vec = "src/alloc/vec"
map = "src/alloc/map"
str = "src/alloc/str"
arr = "src/alloc/arr"
bytes = "src/alloc/bytes"
maybe = "src/alloc/maybe"
result = "src/alloc/result"

# std/ - platform operations via PAL
std = "src/std"

# aux/ - auxiliary macros, panic, test, startup, backtrace
macros = "src/aux/macros"

[macros]
assert = "src/aux/macros/assert"
dbg = "src/aux/macros/dbg"
panic = "src/aux/macros/panic"
unreachable = "src/aux/macros/panic"
assert_eq = "src/aux/macros/checks"
assert_ne = "src/aux/macros/checks"
trace_i64 = "src/aux/macros/checks"

[security]
mode = "strict"
externs = ["rt_*", "owl_archive_*"]
extern_libs = ["c"]
macros = ["assert", "dbg", "panic", "unreachable", "assert_eq", "assert_ne", "trace_i64"]

[c]
sources = ["code/c/json_parser.c", "code/c/toml_parser.c"]
libs = ["m"]
["owl@lock"]
version = "3"