[project]
name = "mire"
version = "0.0.7"
description = "Library for the Mire language"
entry = "code/mod.mire"

[build]
compiler = "mire"
profile = "debug"
opt-level = 0

[paths]
sources = "."
tests = "tests"
output = "bin"
cache = "bin/.cache"

[exports]
vec = "core/vec"
map = "core/map"
str = "core/str"
maybe = "core/maybe"
result = "core/result"
arr = "core/arr"

# Library macros — auto-scoped into every project that depends on mire (and
# into mire's own builds). Each entry maps the bare macro name to a source
# file declaring it with `@[macro!]`. No `load` is needed at call sites.
[macros]
assert = "core/macros/assert"
dbg = "core/macros/dbg"
panic = "core/macros/panic"
unreachable = "core/macros/panic"

# Strict security mode. All externs in mire's core are runtime helpers
# (`rt_*`), declared with `lib "c"`; every macro mire ships is allowlisted so
# `assert!`/`dbg!`/`panic!`/`unreachable!` remain available in strict projects.
[security]
mode = "strict"
externs = ["rt_*"]
extern_libs = ["c"]
macros = ["assert", "dbg", "panic", "unreachable"]
